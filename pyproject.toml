[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stylus-reader"
version = "1.0.0"
description = "GTK4 reader for PDF, TXT, Markdown and DOCX designed for stylus input and partially broken touchscreens"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Alisa-gh2" }]
keywords = ["gtk4", "pdf", "reader", "stylus", "accessibility", "touchscreen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
    "Topic :: Multimedia :: Graphics :: Viewers",
]

[project.urls]
Homepage = "https://github.com/Alisa-gh2/stylus-reader"
Issues = "https://github.com/Alisa-gh2/stylus-reader/issues"

[project.optional-dependencies]
# PyGObject и GTK4 ставятся системным пакетным менеджером:
#   Debian/Ubuntu/Kali: python3-gi gir1.2-gtk-4.0
#   Fedora:             python3-gobject gtk4
#   Arch:               python-gobject gtk4
# Опционально для ночного фолбэка без цветовой матрицы:
night-fallback = ["Pillow"]

[project.scripts]
stylus-reader = "stylus_reader.main:main"

[tool.setuptools]
packages = ["stylus_reader", "stylus_reader.ui"]
