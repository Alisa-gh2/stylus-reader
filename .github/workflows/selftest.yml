name: selftest

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  headless:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Установить GTK4, PyGObject и инструменты рендера
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo gir1.2-gtk-4.0 \
            xvfb poppler-utils mupdf-tools fonts-dejavu-core

      - name: Версии окружения
        run: |
          python3 --version
          python3 -c "import gi; gi.require_version('Gtk','4.0'); from gi.repository import Gtk; print('GTK', Gtk.get_major_version(), Gtk.get_minor_version(), Gtk.get_micro_version())"
          pdftoppm -v 2>&1 | head -1
          mutool -v 2>&1 | head -1

      - name: Компиляция
        run: python3 -m compileall -q stylus_reader

      - name: Headless-самопроверка (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            env GDK_BACKEND=x11 python3 -m stylus_reader --selftest
